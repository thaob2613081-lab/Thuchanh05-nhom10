<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Trang phát video bài thực hành và infographic của Nhóm 10.">
	<title>Lợi ích của công nghệ số| Nhóm 10</title>
	<style>
		:root {
			color-scheme: light;
			font-family: "Segoe UI", Tahoma, sans-serif;
			color: #202a31;
			background: #f2f5f3;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 32px 18px;
		}

		main {
			width: min(100%, 880px);
			padding: clamp(24px, 5vw, 48px);
			background: #fff;
			border: 1px solid #dce5df;
			border-radius: 12px;
			box-shadow: 0 18px 48px rgb(30 55 43 / 8%);
		}

		.eyebrow {
			margin: 0 0 10px;
			color: #28745a;
			font-size: 0.78rem;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-size: clamp(1.8rem, 5vw, 2.6rem);
			line-height: 1.2;
		}

		.description {
			max-width: 62ch;
			margin: 14px 0 28px;
			color: #58665f;
			font-size: 1rem;
			line-height: 1.7;
		}

		.infographic {
			margin: 0 0 28px;
		}

		h2 {
			margin: 0 0 12px;
			font-size: 1.25rem;
			line-height: 1.35;
		}

		.infographic figure {
			margin: 0;
		}

		.infographic img {
			display: block;
			width: 100%;
			height: auto;
			border: 1px solid #e7ece8;
			border-radius: 8px;
		}

		.infographic figcaption {
			margin-top: 10px;
			color: #66736c;
			font-size: 0.875rem;
			line-height: 1.6;
		}

		video {
			display: block;
			width: 100%;
			aspect-ratio: 16 / 9;
			background: #111;
			border-radius: 8px;
		}

		.credit {
			margin: 16px 0 0;
			padding-top: 14px;
			border-top: 1px solid #e7ece8;
			color: #66736c;
			font-size: 0.875rem;
			line-height: 1.6;
		}

		.live-chat {
			position: fixed;
			right: 24px;
			bottom: 24px;
			padding: 13px 20px;
			border-radius: 999px;
			background: #0866ff;
			box-shadow: 0 8px 24px rgb(30 55 43 / 22%);
			color: #fff;
			font-size: 0.95rem;
			font-weight: 700;
			text-decoration: none;
			transition: background-color 160ms ease, transform 160ms ease;
		}

		.live-chat:hover {
			background: #0052cc;
			transform: translateY(-2px);
		}

		.live-chat:focus-visible {
			outline: 3px solid #202a31;
			outline-offset: 3px;
		}

		@media (max-width: 480px) {
			.live-chat {
				right: 16px;
				bottom: 16px;
			}
		}
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">Bài báo cáo · Nhóm 10</p>
		<h1>Lợi ích của công nghệ số </h1>
		
		<section class="infographic" aria-labelledby="infographic-title">
			<figcaption id="infographic-title">Infographic minh họa</figcaption>
			<figure>
				<img src="Buoi5-Nhom10-bai2.1.png" alt="Infographic minh họa">
				<figcaption>Video minh họa</figcaption>
			</figure>
		</section>

		<video controls preload="metadata" aria-label="Video minh họa">
			<source src="Buoi5-Nhom10-Bai2.2.mp4" type="video/mp4">
			Trình duyệt của bạn không hỗ trợ phát video HTML5.
		</video>

		<p class="credit">
			Nguồn: Video tạo bởi CapCut, tài liệu từ Pexels/FreeSound, infographic được tạo bởi Canva AI và ảnh từ Unsplash.
		</p>
	</main>
	<a class="live-chat" href="https://zalo.me/0789537933" target="_blank" rel="noopener noreferrer" aria-label="Mở Zalo để liên hệ hỗ trợ">Live Chat</a>
</body>
</html>
